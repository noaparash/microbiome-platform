# Microbiome Platform — nginx in front of the website, for AlmaLinux / RHEL 9 (e.g. peptibase10).
# HTTPS on port 443 only, and only from the lab network / VPN ranges. No port 80: on a shared
# server another service may already use it (peptibase10: something listens on 127.0.0.1:80).
#
# Install (as root): fill in every <...> below, then
#   cp microplatform.almalinux.conf /etc/nginx/conf.d/microplatform.conf
#   nginx -t && systemctl enable --now nginx      (or: systemctl reload nginx)
# Step-by-step commands: docs/admin-peptibase10.md

# Access log WITHOUT the requested address: a run's address is its key (anyone with the
# link can open the results), so logs keep only who, when, method and status.
log_format microplatform_private '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent';

server {
    # The server's own network address only (not 0.0.0.0), port 443 only.
    listen <SERVER_IP>:443 ssl http2;
    server_name <HOSTNAME>;

    # The certificate from the university's IT, for <HOSTNAME> (PEM; the .crt holds the full chain).
    ssl_certificate     /etc/pki/tls/certs/<HOSTNAME>.crt;
    ssl_certificate_key /etc/pki/tls/private/<HOSTNAME>.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Who may connect: DEFAULT IS RESTRICTED ---------------------------------------
    # One "allow" line per lab network / university VPN range (from IT); everyone else: 403.
    # The firewall allows port 443 only from the same ranges; this is the second lock.
    allow <LAB_NETWORK_CIDR>;
    allow <VPN_CIDR>;
    deny  all;

    # Same limit as MICROPLATFORM_MAX_UPLOAD_MB.
    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/microplatform.access.log microplatform_private;

    location / {
        # The website (gunicorn, a user service of the platform's account) on this machine only.
        # SELinux: needs  setsebool -P httpd_can_network_connect 1
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;   # a little above gunicorn's timeout
        proxy_request_buffering on;
    }
}
