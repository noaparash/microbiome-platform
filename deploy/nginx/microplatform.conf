# Microbiome Platform — nginx in front of gunicorn: HTTPS, and access limited to the lab.
# Install: sudo cp deploy/nginx/microplatform.conf /etc/nginx/sites-available/microplatform
#          sudo ln -s /etc/nginx/sites-available/microplatform /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Replace every <...> below. See docs/deployment.he.md.

# Access log WITHOUT the requested address: a run's address is its key (anyone with the
# link can open the results), so logs keep only who, when, method and status.
log_format microplatform_private '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent';

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    server_name <HOSTNAME>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <HOSTNAME>;

    # The certificate from the university / IT (or Let's Encrypt if the server is reachable).
    ssl_certificate     /etc/ssl/certs/<HOSTNAME>.crt;
    ssl_certificate_key /etc/ssl/private/<HOSTNAME>.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Who may connect: DEFAULT IS RESTRICTED ---------------------------------------
    # Allow only the lab network and/or the university VPN ranges (ask IT for them).
    # Everyone else gets "403 Forbidden". To open to the internet, remove these lines —
    # only after a deliberate decision (see the checklist in docs/deployment.he.md).
    allow <LAB_NETWORK_CIDR>;      # e.g. the lab's subnet
    allow <VPN_CIDR>;              # e.g. the university VPN range
    deny  all;

    # Same limit as MICROPLATFORM_MAX_UPLOAD_MB.
    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/microplatform.access.log microplatform_private;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;   # a little above gunicorn's timeout
        proxy_request_buffering on;
    }
}
